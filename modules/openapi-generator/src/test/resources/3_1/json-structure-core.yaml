openapi: 3.1.0
info:
  title: JSON Structure test
  version: 1.0.0
paths:
  /measurements:
    post:
      operationId: createMeasurement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Measurement'
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Measurement'
components:
  schemas:
    Measurement:
      $schema: https://json-structure.org/meta/core/v0/#
      $id: https://api.example.com/schemas/measurement
      name: Measurement
      type: object
      required:
        - sequence
        - reading
      properties:
        sequence:
          type: int64
        reading:
          type: decimal
          precision: 18
          scale: 4
        tags:
          type: set
          items:
            type: string
